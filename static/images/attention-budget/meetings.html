<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Does this meeting need to happen?</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400&amp;family=Libre+Franklin:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;   /* white-smoke */
      --color-ink:     #212529;   /* jet-black */
      --color-muted:   #666666;   /* blue-slate */
      --color-accent:  #8b0000;   /* burnt-tangerine */
      --font-sans:     'Libre Franklin', system-ui, sans-serif;
      --font-serif:    'Crimson Pro', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; min-width: 0; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

dth="1"/><text x="210" y="288" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="middle">YES</text><rect x="402.0" y="348" width="44" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="424" y="368" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="middle">NO</text><rect x="181.0" y="468" width="58" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="210" y="488" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="middle">YES</text><rect x="395.0" y="548" width="58" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="424" y="568" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="middle">YES</text><rect x="188.0" y="672" width="44" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="210" y="692" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="middle">NO</text><polygon points="176,120 304,184 176,248 48,184" fill="#ffffff" stroke="#212529" stroke-width="1"/><text x="176" y="177" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">Clear</text><text x="176" y="207" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">outcome?</text><polygon points="176,320 304,384 176,448 48,384" fill="#ffffff" stroke="#212529" stroke-width="1"/><text x="176" y="377" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">Requires</text><text x="176" y="407" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">you?</text><polygon points="176,520 304,584 176,648 48,584" fill="#ffffff" stroke="#212529" stroke-width="1"/><text x="176" y="577" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">Document</text><text x="176" y="607" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">enough?</text><rect x="552" y="144" width="320" height="80" rx="6" fill="#ffffff" stroke="#212529" stroke-width="1"/><text x="712.0" y="177.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">Cancel or</text><text x="712.0" y="207.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">move async</text><rect x="552" y="344" width="320" height="80" rx="6" fill="#ffffff" stroke="#212529" stroke-width="1"/><text x="712.0" y="377.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">Delegate</text><text x="712.0" y="407.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">or skip</text><rect x="552" y="544" width="320" height="80" rx="6" fill="#ffffff" stroke="#212529" stroke-width="1"/><text x="712.0" y="577.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">Write the</text><text x="712.0" y="607.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">document</text><rect x="544" y="672" width="328" height="64" rx="24" fill="#f6ebeb" stroke="#8b0000" stroke-width="1"/><text x="708.0" y="712.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#8b0000" text-anchor="middle">Keep the meeting</text><line x1="40" y1="756" x2="920" y2="756" stroke="#dee2e6" stroke-width="1.2"/><text x="40" y="792" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="start">One meeting in → remove or shorten another.</text></svg>
    </div>
