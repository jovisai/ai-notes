<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What worktrees isolate, and what they share</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400&amp;family=Libre+Franklin:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;   /* white-smoke */
      --color-ink:     #212529;   /* jet-black */
      --color-muted:   #666666;   /* blue-slate */
      --color-accent:  #8b0000;   /* burnt-tangerine */
      --font-sans:     'Libre Franklin', system-ui, sans-serif;
      --font-serif:    'Crimson Pro', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; min-width: 0; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <!-- Source: cathrynlavery/diagram-design; light variant; doc-inline width, enlarged blog labels. -->
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>


    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->

      <svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="isolation-title isolation-desc"><title id="isolation-title">What worktrees isolate, and what they share</title><desc id="isolation-desc">Three working directories have separate files and sessions but share Git history and remotes; external services and ports are not automatically isolated.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b0000"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker></defs><rect width="960" height="600" fill="#ffffff"/><text x="40" y="64" font-family="'Crimson Pro', serif" font-size="40" font-weight="400" fill="#212529" text-anchor="start">What worktrees isolate, and what they share</text><text x="40" y="108" font-family="'Libre Franklin', sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="start">One repository · separate working files and conversations</text><path d="M408,216 L408,260 Q408,268 400,268 L176,268 Q168,268 168,276 L168,336" fill="none" stroke="#666666" stroke-width="1.2"/><line x1="480" y1="216" x2="480" y2="336" stroke="#666666" stroke-width="1.2"/><path d="M552,216 L552,260 Q552,268 560,268 L784,268 Q792,268 792,276 L792,336" fill="none" stroke="#666666" stroke-width="1.2"/><rect x="336" y="136" width="288" height="80" rx="6" fill="#f6ebeb" stroke="#8b0000" stroke-width="1"/><text x="480.0" y="169.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#8b0000" text-anchor="middle">Shared Git data</text><text x="480.0" y="199.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#8b0000" text-anchor="middle">History + remotes</text><rect x="40" y="336" width="256" height="80" rx="6" fill="#ffffff" stroke="#212529" stroke-width="1"/><text x="168.0" y="369.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">Main checkout</text><text x="168.0" y="399.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">your current work</text><text x="168" y="460" font-family="'Libre Franklin', sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="middle">Main session</text><rect x="352" y="336" width="256" height="80" rx="6" fill="#ffffff" stroke="#212529" stroke-width="1"/><text x="480.0" y="369.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">feature-auth</text><text x="480.0" y="399.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">separate files</text><text x="480" y="460" font-family="'Libre Franklin', sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="middle">Claude session A</text><rect x="664" y="336" width="256" height="80" rx="6" fill="#ffffff" stroke="#212529" stroke-width="1"/><text x="792.0" y="369.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">bugfix-api</text><text x="792.0" y="399.0" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="middle">separate files</text><text x="792" y="460" font-family="'Libre Franklin', sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="middle">Claude session B</text><line x1="40" y1="536" x2="920" y2="536" stroke="#dee2e6" stroke-width="1.2"/><text x="40" y="572" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="start">Worktrees separate file edits. Ports, services, and external databases still need coordination.</text></svg>
    </div>
  </div>
</body>
</html>
