<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turn an ambition into a test</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400&amp;family=Libre+Franklin:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;   /* white-smoke */
      --color-ink:     #212529;   /* jet-black */
      --color-muted:   #666666;   /* blue-slate */
      --color-accent:  #8b0000;   /* burnt-tangerine */
      --font-sans:     'Libre Franklin', system-ui, sans-serif;
      --font-serif:    'Crimson Pro', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; min-width: 0; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <!-- Source: cathrynlavery/diagram-design; light variant; doc-inline width, enlarged blog labels. -->
  <div class="frame">
    <p class="eyebrow">Dumbbell comparison · Diagram Design</p>


    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="experiment-title experiment-desc"><title id="experiment-title">Turn an ambition into a test</title><desc id="experiment-desc">An illustrative lead-research experiment targets five minutes per lead from a twenty-minute baseline while preserving qualification quality; this is a proposed target, not an achieved result.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b0000"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker></defs><rect width="960" height="600" fill="#ffffff"/><text x="40" y="64" font-family="'Crimson Pro', serif" font-size="40" font-weight="400" fill="#212529" text-anchor="start">Turn an ambition into a test</text><text x="40" y="108" font-family="'Libre Franklin', sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="start">Example experiment · proposed target, not a reported result</text><line x1="120" y1="184" x2="120" y2="348" stroke="#dee2e6" stroke-width="1.2"/><text x="120" y="382" font-family="'Libre Franklin', sans-serif" font-size="20" font-weight="400" fill="#666666" text-anchor="middle">0</text><line x1="280" y1="184" x2="280" y2="348" stroke="#dee2e6" stroke-width="1.2"/><text x="280" y="382" font-family="'Libre Franklin', sans-serif" font-size="20" font-weight="400" fill="#666666" text-anchor="middle">5</text><line x1="440" y1="184" x2="440" y2="348" stroke="#dee2e6" stroke-width="1.2"/><text x="440" y="382" font-family="'Libre Franklin', sans-serif" font-size="20" font-weight="400" fill="#666666" text-anchor="middle">10</text><line x1="600" y1="184" x2="600" y2="348" stroke="#dee2e6" stroke-width="1.2"/><text x="600" y="382" font-family="'Libre Franklin', sans-serif" font-size="20" font-weight="400" fill="#666666" text-anchor="middle">15</text><line x1="760" y1="184" x2="760" y2="348" stroke="#dee2e6" stroke-width="1.2"/><text x="760" y="382" font-family="'Libre Franklin', sans-serif" font-size="20" font-weight="400" fill="#666666" text-anchor="middle">20</text><line x1="120" y1="348" x2="824" y2="348" stroke="#666666" stroke-width="1.2"/><text x="856" y="387" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="start">MIN</text><line x1="280" y1="264" x2="760" y2="264" stroke="#212529" stroke-width="1.2"/><circle cx="760" cy="264" r="8" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><circle cx="280" cy="264" r="8" fill="#8b0000" stroke="#212529" stroke-width="1"/><text x="280" y="218" font-family="'Libre Franklin', sans-serif" font-size="25" font-weight="600" fill="#8b0000" text-anchor="middle">Target: 5 min</text><text x="760" y="218" font-family="'Libre Franklin', sans-serif" font-size="25" font-weight="600" fill="#212529" text-anchor="middle">Baseline: 20 min</text><rect x="120" y="432" width="720" height="72" rx="6" fill="#f6ebeb" stroke="#8b0000" stroke-width="1"/><text x="480" y="477" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#8b0000" text-anchor="middle">Guardrail: preserve qualification quality</text><line x1="40" y1="536" x2="920" y2="536" stroke="#dee2e6" stroke-width="1.2"/><text x="40" y="572" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="start">One task: research an inbound lead. Compare speed and quality before scaling.</text></svg>
    </div>
  </div>
</body>
</html>
