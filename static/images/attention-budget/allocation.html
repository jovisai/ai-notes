<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Give your best work a real budget</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400&amp;family=Libre+Franklin:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;   /* white-smoke */
      --color-ink:     #212529;   /* jet-black */
      --color-muted:   #666666;   /* blue-slate */
      --color-accent:  #8b0000;   /* burnt-tangerine */
      --font-sans:     'Libre Franklin', system-ui, sans-serif;
      --font-serif:    'Crimson Pro', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; min-width: 0; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <!-- Source: cathrynlavery/diagram-design; light variant; doc-inline width, enlarged blog labels. -->
  <div class="frame">
    <p class="eyebrow">Bar chart · Diagram Design</p>

ext x="632.0" y="484" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="middle">30%</text><line x1="736.0" y1="136" x2="736.0" y2="452" stroke="#dee2e6" stroke-width="1.2"/><text x="736.0" y="484" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="middle">40%</text><line x1="840.0" y1="136" x2="840.0" y2="452" stroke="#dee2e6" stroke-width="1.2"/><text x="840.0" y="484" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="middle">50%</text><text x="40" y="190" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="start">Reactive</text><rect x="320" y="160" width="208.0" height="48" rx="0" fill="#efefef" stroke="#666666" stroke-width="1"/><text x="540.0" y="191" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="start">20%</text><text x="40" y="274" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="start">Necessary</text><rect x="320" y="244" width="364.0" height="48" rx="0" fill="#efefef" stroke="#666666" stroke-width="1"/><text x="696.0" y="275" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="start">35%</text><text x="40" y="358" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="start">High leverage</text><rect x="320" y="328" width="468.0" height="48" rx="0" fill="#f6ebeb" stroke="#8b0000" stroke-width="1"/><text x="800.0" y="359" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#8b0000" text-anchor="start">45%</text><text x="40" y="442" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="start">Low value</text><text x="332.0" y="443" font-family="'Libre Franklin', sans-serif" font-size="24" font-weight="600" fill="#212529" text-anchor="start">0%</text><line x1="40" y1="536" x2="920" y2="536" stroke="#dee2e6" stroke-width="1.2"/><text x="40" y="572" font-family="'Libre Franklin', sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="start">Protect high-leverage work. Cut low-value commitments.</text></svg>
    </div>
  </div>
</body>
</html>
